[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridharvest"
version = "0.1.0"
description = "Modular simulation and control framework for hybrid renewable energy harvesting"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "shashank N", email = "134797738+000-Shashank@users.noreply.github.com" }]
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]
ai = ["openai>=1.30", "anthropic>=0.30"]
ui = ["streamlit>=1.35", "plotly>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"